<!DOCTYPE html>
<html>

<head>

<title>UCoin</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
background:black;
color:white;
font-family:Arial;
padding:30px;
}

button{
width:100%;
height:60px;
border:none;
border-radius:15px;
font-size:22px;
font-weight:bold;
margin-top:20px;
}

.connect{
background:#f3ba2f;
color:black;
}

.buy{
background:white;
color:black;
}

#wallet{
margin-top:20px;
word-break:break-all;
color:#00ff99;
}

.info{
margin-top:15px;
color:#aaa;
line-height:1.5;
}

</style>

</head>

<body>

<h1>
UCoin 🚀
</h1>

<p id="wallet">
Wallet not connected
</p>

<button
class="connect"
onclick="connectBinance()"
>

Connect Binance Wallet

</button>

<button
class="buy"
onclick="buyToken()"
>

Buy UCoin

</button>

<p class="info">
Supports Binance Web3 Wallet + Solana wallets 😄
</p>

<script>

async function connectBinance(){

if(window.ethereum){

try{

const accounts =
await window.ethereum.request({
method: 'eth_requestAccounts'
});

document.getElementById(
"wallet"
).innerText =
"Connected: " + accounts[0];

alert(
"Binance/EVM Wallet Connected 🚀"
);

}catch(err){

alert(
"Connection Cancelled"
);

}

}else if(window.solana){

try{

const response =
await window.solana.connect();

document.getElementById(
"wallet"
).innerText =
"Connected: " +
response.publicKey.toString();

alert(
"Solana Wallet Connected 🚀"
);

}catch(err){

alert(
"Connection Cancelled"
);

}

}else{

window.open(
"https://www.binance.com/en/web3wallet",
"_blank"
);

}

}

function buyToken(){

window.open(
"upi://pay?pa=ribmgsm@okaxis&pn=UCoin&cu=INR"
);

}

</script>

</body>

</html>
