<!DOCTYPE html>
<html>

<head>

<title>UCoin Wallet</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<style>

body{
background:black;
color:white;
font-family:Arial;
padding:20px;
}

.card{
background:#111;
padding:20px;
border-radius:20px;
margin-top:20px;
}

button{
width:100%;
height:60px;
border:none;
border-radius:15px;
font-size:20px;
font-weight:bold;
margin-top:15px;
}

.create{
background:#00ff99;
color:black;
}

.buy{
background:white;
color:black;
}

.wallet{
margin-top:15px;
word-break:break-all;
color:#00ff99;
}

input{
width:100%;
height:55px;
border:none;
border-radius:15px;
padding:15px;
font-size:18px;
margin-top:20px;
background:#1a1a1a;
color:white;
}

</style>

</head>

<body>

<h1>
UCoin 🚀
</h1>

<div class="card">

<h2>
Real Solana Wallet
</h2>

<p
class="wallet"
id="wallet"
>

Wallet not created

</p>

<button
class="create"
onclick="createWallet()"
>

Create Real Wallet

</button>

</div>

<div class="card">

<h2>
Buy UCoin
</h2>

<input
id="amount"
type="number"
placeholder="Enter INR Amount"
/>

<button
class="buy"
onclick="buyNow()"
>

Pay with UPI

</button>

</div>

<script type="module">

import {
Keypair
} from 'https://esm.sh/@solana/web3.js';

window.createWallet = async () => {

let saved =
localStorage.getItem(
"ucoin_wallet"
);

if(saved){

document.getElementById(
"wallet"
).innerText =
JSON.parse(saved).publicKey;

alert(
"Wallet Loaded 🚀"
);

return;

}

const keypair =
Keypair.generate();

const walletData = {

publicKey:
keypair.publicKey.toString(),

secretKey:
Array.from(
keypair.secretKey
)

};

localStorage.setItem(
"ucoin_wallet",
JSON.stringify(walletData)
);

document.getElementById(
"wallet"
).innerText =
walletData.publicKey;

alert(
"REAL Solana Wallet Created 🚀"
);

};

window.buyNow = () => {

let amount =
document.getElementById(
"amount"
).value;

if(amount == ""){

alert(
"Enter Amount"
);

return;

}

window.open(
`upi://pay?pa=ribmgsm@okaxis&pn=UCoin&am=${amount}&cu=INR`
);

};

window.onload = () => {

let saved =
localStorage.getItem(
"ucoin_wallet"
);

if(saved){

document.getElementById(
"wallet"
).innerText =
JSON.parse(saved).publicKey;

}

};

</script>

</body>

</html>
