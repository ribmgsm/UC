<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>UCoin</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#000;
color:white;
padding:20px;
}

.logo{
font-size:42px;
font-weight:bold;
margin-top:20px;
}

.card{
background:#111;
padding:20px;
border-radius:25px;
margin-top:20px;
}

.wallet{
margin-top:15px;
word-break:break-all;
color:#00ff99;
}

button{
width:100%;
height:60px;
border:none;
border-radius:18px;
font-size:20px;
font-weight:bold;
margin-top:15px;
}

.connect{
background:#ab9ff2;
color:black;
}

.buy{
background:white;
color:black;
}

.qr{
width:100%;
background:white;
padding:10px;
border-radius:20px;
margin-top:20px;
}

input{
width:100%;
height:55px;
border:none;
border-radius:15px;
padding:15px;
font-size:20px;
margin-top:20px;
background:#1a1a1a;
color:white;
}

.history{
color:#aaa;
margin-top:10px;
line-height:1.5;
}

</style>

</head>

<body>

<div class="logo">
UCoin 🚀
</div>

<div class="card">

<h2>
Phantom Wallet
</h2>

<p
class="wallet"
id="walletAddress"
>

Wallet not connected

</p>

<button
class="connect"
onclick="connectPhantom()"
>

Connect Phantom

</button>

</div>

<div class="card">

<h2>
Buy UCoin
</h2>

<input
id="amount"
type="number"
placeholder="Enter INR Amount"
/>

<button
class="buy"
onclick="payUPI()"
>

Buy with UPI

</button>

<img
class="qr"
src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=upi://pay?pa=ribmgsm@okaxis&pn=UCoin&cu=INR"
/>

<p class="history">
UPI ID: ribmgsm@okaxis
</p>

</div>

<script>

async function connectPhantom(){

if(window.solana && window.solana.isPhantom){

try{

const response =
await window.solana.connect();

document.getElementById(
"walletAddress"
).innerText =
response.publicKey.toString();

alert(
"Phantom Connected 🚀"
);

}catch(err){

alert(
"Connection Cancelled"
);

}

}else{

window.open(
"https://phantom.app/",
"_blank"
);

}

}

function payUPI(){

let amount =
document.getElementById(
"amount"
).value;

if(amount == ""){

alert(
"Enter Amount"
);

return;

}

window.open(
`upi://pay?pa=ribmgsm@okaxis&pn=UCoin&am=${amount}&cu=INR`
);

}

</script>

</body>

</html>
