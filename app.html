<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>UCoin Solana</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#000;
color:white;
padding:20px;
padding-bottom:100px;
}

.logo{
font-size:42px;
font-weight:bold;
margin-top:20px;
}

.card{
background:#111;
padding:20px;
border-radius:25px;
margin-top:20px;
}

.balance{
font-size:48px;
font-weight:bold;
margin-top:10px;
}

.inr{
margin-top:10px;
color:#00ff99;
font-size:20px;
}

button{
width:100%;
height:60px;
border:none;
border-radius:18px;
font-size:20px;
font-weight:bold;
margin-top:15px;
}

.connect{
background:#ab9ff2;
color:black;
}

.buy{
background:white;
color:black;
}

.sell{
background:#222;
color:white;
}

input{
width:100%;
height:55px;
border:none;
border-radius:15px;
padding:15px;
font-size:20px;
margin-top:20px;
background:#1a1a1a;
color:white;
}

.wallet{
margin-top:15px;
word-break:break-all;
color:#00ff99;
}

.qr{
width:100%;
background:white;
padding:10px;
border-radius:20px;
margin-top:20px;
}

.history{
color:#aaa;
margin-top:10px;
line-height:1.5;
}

</style>

</head>

<body>

<div class="logo">
UCoin 🚀
</div>

<div class="card">

<h2>
Solana Wallet
</h2>

<p
class="wallet"
id="walletAddress"
>

Wallet not connected

</p>

<button
class="connect"
onclick="connectWallet()"
>

Connect Solana Wallet

</button>

</div>

<div class="card">

<h2>
Wallet Balance
</h2>

<div class="balance">
1250 UCoin
</div>

<div class="inr">
≈ ₹15,420
</div>

<button
class="buy"
onclick="buyToken()"
>

Buy UCoin

</button>

<button
class="sell"
onclick="sellToken()"
>

Sell UCoin

</button>

</div>

<div class="card">

<h2>
Buy using UPI
</h2>

<input
id="amount"
type="number"
placeholder="Enter INR Amount"
/>

<button
class="buy"
onclick="openUPI()"
>

Pay Now

</button>

<img
class="qr"
src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=upi://pay?pa=ribmgsm@okaxis&pn=UCoin&cu=INR"
/>

<p class="history">
UPI ID: ribmgsm@okaxis
</p>

</div>

<div class="card">

<h2>
Supported Wallets
</h2>

<p class="history">
✅ Phantom
</p>

<p class="history">
✅ Solflare
</p>

<p class="history">
✅ Backpack
</p>

<p class="history">
✅ Binance Solana Wallet
</p>

</div>

<script>

async function connectWallet(){

if(window.solana){

try{

const response =
await window.solana.connect();

document.getElementById(
"walletAddress"
).innerText =
response.publicKey.toString();

alert(
"Solana Wallet Connected 🚀"
);

}catch(err){

alert(
"Connection Cancelled"
);

}

}else{

alert(
"No Solana wallet found"
);

window.open(
"https://phantom.app/",
"_blank"
);

}

}

function openUPI(){

let amount =
document.getElementById(
"amount"
).value;

if(amount == ""){

alert(
"Enter amount"
);

return;

}

window.open(
`upi://pay?pa=ribmgsm@okaxis&pn=UCoin&am=${amount}&cu=INR`
);

}

function buyToken(){

window.scrollTo({
top:500,
behavior:"smooth"
});

}

function sellToken(){

alert(
"Sell feature coming soon 🚀"
);

}

</script>

</body>

</html>
