<script type="module">

import {
Keypair
} from 'https://esm.sh/@solana/web3.js';

import bs58 from 'https://esm.sh/bs58';

window.showImport = () => {

document.getElementById(
"importUI"
).innerHTML = `

<textarea
id="privateKeyInput"
placeholder="Paste Phantom Private Key"
style="
width:100%;
height:120px;
background:#1a1a1a;
border:none;
border-radius:15px;
padding:15px;
color:white;
margin-top:15px;
"
></textarea>

<button
class="secondary"
onclick="importWallet()"
>

Import Wallet

</button>

`;

};

window.importWallet = () => {

try{

let privateKey =
document.getElementById(
"privateKeyInput"
).value.trim();

if(privateKey == ""){

alert(
"Paste Private Key"
);

return;

}

const secretKey =
bs58.decode(privateKey);

const keypair =
Keypair.fromSecretKey(
secretKey
);

const walletData = {

publicKey:
keypair.publicKey.toString(),

privateKey:
privateKey

};

localStorage.setItem(
"ucoin_wallet",
JSON.stringify(walletData)
);

document.getElementById(
"walletAddress"
).innerText =
walletData.publicKey;

alert(
"Phantom Wallet Imported 🚀"
);

}catch(err){

alert(
"Invalid Phantom Private Key"
);

console.log(err);

}

};

</script>
