<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
/>

<title>UCoin</title>

<link
rel="manifest"
href="/manifest.json"
/>

<meta
name="theme-color"
content="#000000"
/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#000;
color:white;
padding:20px;
padding-bottom:100px;
}

.logo{
font-size:42px;
font-weight:bold;
margin-top:20px;
}

.card{
background:#111;
padding:20px;
border-radius:25px;
margin-top:20px;
}

.connectBtn{
width:100%;
height:60px;
border:none;
border-radius:18px;
font-size:18px;
font-weight:bold;
background:#8b5cf6;
color:white;
margin-top:15px;
}

.swapBtn{
width:100%;
height:60px;
border:none;
border-radius:18px;
font-size:18px;
font-weight:bold;
background:white;
color:black;
margin-top:15px;
}

.balance{
font-size:42px;
font-weight:bold;
margin-top:10px;
}

.wallet{
margin-top:15px;
font-size:14px;
word-break:break-all;
color:#00ff99;
}

.token{
background:#1a1a1a;
padding:15px;
border-radius:15px;
margin-top:12px;
}

.tokenName{
font-size:13px;
word-break:break-all;
}

.tokenBalance{
margin-top:6px;
font-weight:bold;
color:#00ff99;
}

.small{
margin-top:10px;
color:#888;
line-height:1.5;
}

</style>

</head>

<body>

<div class="logo">
UCoin 🚀
</div>

<div class="card">

<h2>
Wallet
</h2>

<button
class="connectBtn"
onclick="connectWallet()"
id="connectButton"
>

Connect Phantom

</button>

<div
class="wallet"
id="walletAddress"
>

Wallet not connected

</div>

<p class="small">
Use Phantom browser for best experience 😄
</p>

</div>

<div class="card">

<h2>
SOL Balance
</h2>

<div
class="balance"
id="solBalance"
>

0 SOL

</div>

</div>

<div class="card">

<h2>
Assets
</h2>

<div id="assets">

<p class="small">
No Assets
</p>

</div>

</div>

<div class="card">

<h2>
Swap
</h2>

<button
class="swapBtn"
onclick="openJupiter()"
>

Open Jupiter

</button>

</div>

<script type="module">

import {
Connection,
PublicKey,
LAMPORTS_PER_SOL
}
from
"https://esm.sh/@solana/web3.js";

const connection =
new Connection(
"https://api.mainnet-beta.solana.com"
);

let wallet = null;

window.connectWallet =
async () => {

try {

const provider =
window.phantom?.solana;

if (
!provider ||
!provider.isPhantom
) {

alert(
"Open this app inside Phantom Browser 😄"
);

window.open(
"https://phantom.app/download",
"_blank"
);

return;

}

const response =
await provider.connect();

wallet =
response.publicKey.toString();

document.getElementById(
"walletAddress"
).innerText =
wallet;

document.getElementById(
"connectButton"
).innerText =
"Wallet Connected";

loadWallet();

} catch(err){

console.log(err);

alert(
"Connection Failed"
);

}

};

async function loadWallet(){

try{

const publicKey =
new PublicKey(wallet);

const balance =
await connection.getBalance(
publicKey
);

document.getElementById(
"solBalance"
).innerText =
(
balance /
LAMPORTS_PER_SOL
).toFixed(4)
+ " SOL";

const tokenAccounts =
await connection.getParsedTokenAccountsByOwner(
publicKey,
{
programId:
new PublicKey(
"TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA"
)
}
);

let html = "";

tokenAccounts.value.forEach(
token => {

const info =
token.account.data.parsed.info;

const amount =
info.tokenAmount.uiAmount;

if(amount > 0){

html += `

<div class="token">

<div class="tokenName">
${info.mint}
</div>

<div class="tokenBalance">
${amount}
</div>

</div>

`;

}

}
);

if(html == ""){

html = `
<p class="small">
No Assets
</p>
`;

}

document.getElementById(
"assets"
).innerHTML = html;

}catch(err){

console.log(err);

}

}

window.openJupiter =
() => {

window.open(
"https://jup.ag",
"_blank"
);

};

setInterval(() => {

if(wallet){

loadWallet();

}

}, 30000);

</script>

</body>

</html>
