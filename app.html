<!DOCTYPE html>
<html>

<head>

<title>UCoin Wallet</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<style>

body{
background:black;
color:white;
font-family:Arial;
padding:20px;
}

.card{
background:#111;
padding:20px;
border-radius:20px;
margin-top:20px;
}

button{
width:100%;
height:60px;
border:none;
border-radius:15px;
font-size:20px;
font-weight:bold;
margin-top:15px;
}

.create{
background:#00ff99;
color:black;
}

.import{
background:#ab9ff2;
color:black;
}

.refresh{
background:#ffaa00;
color:black;
}

.buy{
background:white;
color:black;
}

.wallet{
margin-top:15px;
word-break:break-all;
color:#00ff99;
font-size:14px;
}

input, textarea{
width:100%;
border:none;
border-radius:15px;
padding:15px;
font-size:18px;
margin-top:20px;
background:#1a1a1a;
color:white;
}

textarea{
height:120px;
resize:none;
}

.balance{
font-size:38px;
font-weight:bold;
margin-top:10px;
}

.history{
margin-top:10px;
color:#aaa;
line-height:1.5;
}

</style>

</head>

<body>

<h1>
UCoin 🚀
</h1>

<div class="card">

<h2>
Real Solana Wallet
</h2>

<p
class="wallet"
id="wallet"
>

Wallet not created

</p>

<button
class="create"
onclick="createWallet()"
>

Create Wallet

</button>

<button
class="import"
onclick="importWallet()"
>

Import Wallet

</button>

<textarea
id="secretInput"
placeholder="Paste Secret Key Array"
></textarea>

</div>

<div class="card">

<h2>
SOL Balance
</h2>

<div
class="balance"
id="solBalance"
>

0 SOL

</div>

<button
class="refresh"
onclick="fetchBalance()"
>

Refresh Balance

</button>

</div>

<div class="card">

<h2>
Buy UCoin
</h2>

<input
id="amount"
type="number"
placeholder="Enter INR Amount"
/>

<button
class="buy"
onclick="buyNow()"
>

Pay with UPI

</button>

<p class="history">
UPI ID: ribmgsm@okaxis
</p>

</div>

<script type="module">

import {
Keypair,
Connection,
PublicKey,
LAMPORTS_PER_SOL
} from 'https://esm.sh/@solana/web3.js';

const connection =
new Connection(
'https://api.mainnet-beta.solana.com'
);

function loadWallet(){

let saved =
localStorage.getItem(
"ucoin_wallet"
);

if(saved){

let walletData =
JSON.parse(saved);

document.getElementById(
"wallet"
).innerText =
walletData.publicKey;

fetchBalance();

}

}

window.createWallet = () => {

let saved =
localStorage.getItem(
"ucoin_wallet"
);

if(saved){

loadWallet();

alert(
"Existing wallet loaded 🚀"
);

return;

}

const keypair =
Keypair.generate();

const walletData = {

publicKey:
keypair.publicKey.toString(),

secretKey:
Array.from(
keypair.secretKey
)

};

localStorage.setItem(
"ucoin_wallet",
JSON.stringify(walletData)
);

loadWallet();

alert(
"Real Wallet Created 🚀"
);

};

window.importWallet = () => {

try{

let secret =
document.getElementById(
"secretInput"
).value;

if(secret == ""){

alert(
"Paste secret key"
);

return;

}

let secretArray =
Uint8Array.from(
JSON.parse(secret)
);

const keypair =
Keypair.fromSecretKey(
secretArray
);

const walletData = {

publicKey:
keypair.publicKey.toString(),

secretKey:
Array.from(
keypair.secretKey
)

};

localStorage.setItem(
"ucoin_wallet",
JSON.stringify(walletData)
);

loadWallet();

alert(
"Wallet Imported 🚀"
);

}catch(err){

alert(
"Invalid Secret Key"
);

}

};

window.fetchBalance = async () => {

try{

let saved =
localStorage.getItem(
"ucoin_wallet"
);

if(!saved){

alert(
"No wallet found"
);

return;

}

let walletData =
JSON.parse(saved);

const balance =
await connection.getBalance(
new PublicKey(
walletData.publicKey
)
);

document.getElementById(
"solBalance"
).innerText =
(balance / LAMPORTS_PER_SOL)
.toFixed(4) + " SOL";

}catch(err){

alert(
"Failed to fetch balance"
);

}

};

window.buyNow = () => {

let amount =
document.getElementById(
"amount"
).value;

if(amount == ""){

alert(
"Enter amount"
);

return;

}

window.open(
`upi://pay?pa=ribmgsm@okaxis&pn=UCoin&am=${amount}&cu=INR`
);

};

window.onload = () => {

loadWallet();

};

</script>

</body>

</html>
