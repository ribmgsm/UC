<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>UCoin Wallet</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#000;
color:white;
padding:20px;
padding-bottom:80px;
}

.logo{
font-size:40px;
font-weight:bold;
margin-top:20px;
}

.card{
background:#111;
padding:20px;
border-radius:25px;
margin-top:20px;
}

button{
width:100%;
height:60px;
border:none;
border-radius:18px;
font-size:18px;
font-weight:bold;
margin-top:15px;
}

.primary{
background:white;
color:black;
}

.secondary{
background:#ab9ff2;
color:black;
}

.wallet{
word-break:break-all;
font-size:14px;
margin-top:15px;
color:#00ff99;
}

.balance{
font-size:38px;
font-weight:bold;
margin-top:10px;
}

.token{
background:#1a1a1a;
padding:15px;
border-radius:15px;
margin-top:12px;
}

.tokenName{
font-size:18px;
font-weight:bold;
}

.tokenBalance{
margin-top:5px;
color:#00ff99;
}

.small{
font-size:14px;
color:#aaa;
line-height:1.5;
margin-top:10px;
}

textarea{
width:100%;
height:120px;
background:#1a1a1a;
border:none;
border-radius:15px;
padding:15px;
color:white;
font-size:16px;
margin-top:15px;
resize:none;
}

</style>

</head>

<body>

<div class="logo">
UCoin 🚀
</div>

<div class="card">

<h2>
Import Phantom Wallet
</h2>

<textarea
id="privateKeyInput"
placeholder="Paste Phantom Private Key"
></textarea>

<button
class="secondary"
onclick="importWallet()"
>

Import Wallet

</button>

<p
class="wallet"
id="walletAddress"
>

Wallet not imported

</p>

</div>

<div class="card">

<h2>
SOL Balance
</h2>

<div
class="balance"
id="solBalance"
>

0 SOL

</div>

<button
class="primary"
onclick="refreshAll()"
>

Refresh Wallet

</button>

</div>

<div class="card">

<h2>
Assets
</h2>

<div id="tokenList">

<p class="small">
No assets loaded
</p>

</div>

</div>

<script type="module">

import {
Connection,
PublicKey,
Keypair,
LAMPORTS_PER_SOL
} from 'https://esm.sh/@solana/web3.js?bundle';

import bs58 from 'https://esm.sh/bs58?bundle';

const connection =
new Connection(
'https://solana-mainnet.g.alchemy.com/v2/demo'
);

window.importWallet = async () => {

try{

let privateKey =
document.getElementById(
"privateKeyInput"
).value.trim();

if(!privateKey){

alert(
"Paste Phantom Private Key"
);

return;

}

const decoded =
bs58.decode(privateKey);

const keypair =
Keypair.fromSecretKey(decoded);

const walletData = {

publicKey:
keypair.publicKey.toString(),

privateKey:
privateKey

};

localStorage.setItem(
"ucoin_wallet",
JSON.stringify(walletData)
);

document.getElementById(
"walletAddress"
).innerText =
walletData.publicKey;

refreshAll();

alert(
"Wallet Imported 🚀"
);

}catch(err){

alert(
"Invalid Phantom Private Key"
);

console.log(err);

}

};

window.refreshAll = async () => {

try{

let saved =
localStorage.getItem(
"ucoin_wallet"
);

if(!saved){

return;

}

let walletData =
JSON.parse(saved);

const publicKey =
new PublicKey(
walletData.publicKey
);

const balance =
await connection.getBalance(
publicKey
);

document.getElementById(
"solBalance"
).innerText =
(balance / LAMPORTS_PER_SOL)
.toFixed(4) + " SOL";

const tokenAccounts =
await connection.getParsedTokenAccountsByOwner(
publicKey,
{
programId:
new PublicKey(
"TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA"
)
}
);

let html = "";

tokenAccounts.value.forEach(token => {

const info =
token.account.data.parsed.info;

const amount =
info.tokenAmount.uiAmount;

if(amount > 0){

html += `

<div class="token">

<div class="tokenName">
${info.mint}
</div>

<div class="tokenBalance">
${amount}
</div>

</div>

`;

}

});

if(html == ""){

html = `

<p class="small">
No SPL assets found
</p>

`;

}

document.getElementById(
"tokenList"
).innerHTML = html;

}catch(err){

console.log(err);

alert(
"Failed to load assets"
);

}

};

window.onload = () => {

let saved =
localStorage.getItem(
"ucoin_wallet"
);

if(saved){

let walletData =
JSON.parse(saved);

document.getElementById(
"walletAddress"
).innerText =
walletData.publicKey;

refreshAll();

}

};

setInterval(() => {

refreshAll();

}, 30000);

</script>

</body>

</html>
