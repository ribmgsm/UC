<!DOCTYPE html>
<html>

<head>

<title>UCoin</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
background:black;
color:white;
font-family:Arial;
padding:30px;
}

button{
width:100%;
height:60px;
border:none;
border-radius:15px;
font-size:22px;
font-weight:bold;
margin-top:20px;
}

.connect{
background:#ab9ff2;
color:black;
}

.buy{
background:white;
color:black;
}

#wallet{
margin-top:20px;
word-break:break-all;
color:#00ff99;
}

</style>

</head>

<body>

<h1>
UCoin 🚀
</h1>

<p id="wallet">
Wallet not connected
</p>

<button
class="connect"
onclick="connectPhantom()"
>

Connect Phantom

</button>

<button
class="buy"
onclick="buyToken()"
>

Buy UCoin

</button>

<script>

async function connectPhantom(){

if(window.solana && window.solana.isPhantom){

try{

const response =
await window.solana.connect();

document.getElementById(
"wallet"
).innerText =
response.publicKey.toString();

}catch(err){

alert("Connection Cancelled");

}

}else{

window.open(
"https://phantom.app/",
"_blank"
);

}

}

function buyToken(){

window.open(
"upi://pay?pa=ribmgsm@okaxis&pn=UCoin&cu=INR"
);

}

</script>

</body>

</html>
