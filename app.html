<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="mobile-web-app-capable" content="yes">

<title>UCoin</title>

<link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#000000">

<style>

html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #000;
font-family: Arial;
}

body {
position: fixed;
inset: 0;
}

iframe {
border: none;
width: 100vw;
height: 100vh;
display: block;
}

.connectBtn{

position:fixed;
top:20px;
right:20px;
z-index:9999;

background:#f3ba2f;
color:black;

border:none;

padding:14px 20px;

border-radius:15px;

font-size:16px;
font-weight:bold;

}

.wallet{

position:fixed;
top:80px;
right:20px;
z-index:9999;

background:#111;
color:#00ff99;

padding:12px;

border-radius:15px;

font-size:14px;

max-width:250px;
word-break:break-all;

}

</style>

</head>

<body>

<button
class="connectBtn"
onclick="connectBinance()"
>

Connect Binance

</button>

<div
class="wallet"
id="walletStatus"
>

Wallet not connected

</div>

<iframe src="https://ucoin.live/app.html"></iframe>

<script>

function connectBinance(){

document.getElementById(
"walletStatus"
).innerText =
"Opening Binance Web3 Wallet...";

window.open(
"https://www.binance.com/en/web3wallet",
"_blank"
);

}

if ('serviceWorker' in navigator) {

navigator.serviceWorker.register(
'/service-worker.js'
);

}

</script>

</body>

</html>
