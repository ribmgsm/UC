<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>UCoin Wallet</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#000;
color:white;
padding:20px;
padding-bottom:100px;
}

.logo{
font-size:42px;
font-weight:bold;
margin-top:20px;
}

.card{
background:#111;
padding:20px;
border-radius:25px;
margin-top:20px;
}

.wallet{
word-break:break-all;
font-size:14px;
margin-top:15px;
color:#00ff99;
}

.balance{
font-size:42px;
font-weight:bold;
margin-top:10px;
}

.green{
color:#00ff99;
margin-top:10px;
}

button{
width:100%;
height:60px;
border:none;
border-radius:18px;
font-size:18px;
font-weight:bold;
margin-top:15px;
}

.primary{
background:white;
color:black;
}

.secondary{
background:#ab9ff2;
color:black;
}

.dark{
background:#222;
color:white;
}

textarea,input{
width:100%;
background:#1a1a1a;
border:none;
border-radius:15px;
padding:15px;
color:white;
font-size:16px;
margin-top:15px;
}

textarea{
height:110px;
resize:none;
}

.qr{
width:100%;
background:white;
padding:10px;
border-radius:20px;
margin-top:20px;
}

.small{
font-size:14px;
color:#aaa;
line-height:1.5;
margin-top:10px;
}

</style>

</head>

<body>

<div class="logo">
UCoin 🚀
</div>

<div class="card">

<h2>
Wallet
</h2>

<p
class="wallet"
id="walletAddress"
>

No Wallet Created

</p>

<button
class="secondary"
onclick="createWallet()"
>

Create Wallet

</button>

<button
class="dark"
onclick="showImport()"
>

Import Phantom Key

</button>

<div id="importArea"></div>

</div>

<div class="card">

<h2>
SOL Balance
</h2>

<div
class="balance"
id="solBalance"
>

0 SOL

</div>

<button
class="primary"
onclick="refreshBalance()"
>

Refresh Balance

</button>

</div>

<div class="card">

<h2>
Receive
</h2>

<img
class="qr"
id="qr"
src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=UCoin"
/>

<p class="small">
Receive SOL or UCoin using this address 😄
</p>

</div>

<div class="card">

<h2>
Buy UCoin with UPI
</h2>

<input
id="amount"
type="number"
placeholder="Enter INR Amount"
/>

<button
class="primary"
onclick="buyNow()"
>

Pay with UPI

</button>

<p class="small">
UPI ID: ribmgsm@okaxis
</p>

</div>

<div class="card">

<h2>
Export Private Key
</h2>

<button
class="dark"
onclick="exportKey()"
>

Show Private Key

</button>

<textarea
id="backup"
readonly
placeholder="Private key appears here"
></textarea>

</div>

<script type="module">

import {
Keypair,
Connection,
PublicKey,
LAMPORTS_PER_SOL
} from 'https://esm.sh/@solana/web3.js?bundle';

import bs58 from 'https://esm.sh/bs58?bundle';

const connection =
new Connection(
'https://api.mainnet-beta.solana.com'
);

function updateWallet(walletData){

document.getElementById(
"walletAddress"
).innerText =
walletData.publicKey;

document.getElementById(
"qr"
).src =
`https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${walletData.publicKey}`;

refreshBalance();

}

window.createWallet = () => {

let existing =
localStorage.getItem(
"ucoin_wallet"
);

if(existing){

updateWallet(
JSON.parse(existing)
);

alert(
"Existing Wallet Loaded 🚀"
);

return;

}

const keypair =
Keypair.generate();

const privateKey =
bs58.encode(
keypair.secretKey
);

const walletData = {

publicKey:
keypair.publicKey.toString(),

privateKey:
privateKey

};

localStorage.setItem(
"ucoin_wallet",
JSON.stringify(walletData)
);

updateWallet(walletData);

alert(
"Real Wallet Created 🚀"
);

};

window.showImport = () => {

document.getElementById(
"importArea"
).innerHTML = `

<textarea
id="privateKeyInput"
placeholder="Paste Phantom Private Key"
></textarea>

<button
class="secondary"
onclick="importWallet()"
>

Import Wallet

</button>

`;

};

window.importWallet = () => {

try{

let privateKey =
document.getElementById(
"privateKeyInput"
).value.trim();

if(!privateKey){

alert(
"Paste Private Key"
);

return;

}

const decoded =
bs58.decode(privateKey);

const keypair =
Keypair.fromSecretKey(decoded);

const walletData = {

publicKey:
keypair.publicKey.toString(),

privateKey:
privateKey

};

localStorage.setItem(
"ucoin_wallet",
JSON.stringify(walletData)
);

updateWallet(walletData);

alert(
"Wallet Imported 🚀"
);

}catch(err){

alert(
"Invalid Phantom Private Key"
);

console.log(err);

}

};

window.exportKey = () => {

let saved =
localStorage.getItem(
"ucoin_wallet"
);

if(!saved){

alert(
"No wallet found"
);

return;

}

let walletData =
JSON.parse(saved);

document.getElementById(
"backup"
).value =
walletData.privateKey;

};

window.refreshBalance = async () => {

try{

let saved =
localStorage.getItem(
"ucoin_wallet"
);

if(!saved){

return;

}

let walletData =
JSON.parse(saved);

const balance =
await connection.getBalance(
new PublicKey(
walletData.publicKey
)
);

document.getElementById(
"solBalance"
).innerText =
(balance / LAMPORTS_PER_SOL)
.toFixed(4) + " SOL";

}catch(err){

console.log(err);

}

};

window.buyNow = () => {

let amount =
document.getElementById(
"amount"
).value;

if(amount == ""){

alert(
"Enter Amount"
);

return;

}

window.open(
`upi://pay?pa=ribmgsm@okaxis&pn=UCoin&am=${amount}&cu=INR`
);

};

window.onload = () => {

let saved =
localStorage.getItem(
"ucoin_wallet"
);

if(saved){

updateWallet(
JSON.parse(saved)
);

}

};

</script>

</body>

</html>
