<!DOCTYPE html>
<html>

<head>

<title>UCoin</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
background:black;
color:white;
font-family:Arial;
padding:30px;
}

button{
width:100%;
height:60px;
border:none;
border-radius:15px;
font-size:22px;
font-weight:bold;
margin-top:20px;
}

.connect{
background:#f3ba2f;
color:black;
}

.buy{
background:white;
color:black;
}

</style>

</head>

<body>

<h1>
UCoin 🚀
</h1>

<p id="status">
Wallet not connected
</p>

<button
class="connect"
onclick="connectWallet()"
>

Connect Wallet

</button>

<button
class="buy"
onclick="buyToken()"
>

Buy UCoin

</button>

<script>

function connectWallet(){

alert(
"WalletConnect popup would open here 😄"
);

window.open(
"https://www.binance.com/en/web3wallet",
"_blank"
);

document.getElementById(
"status"
).innerText =
"Binance Wallet Opened 🚀";

}

function buyToken(){

window.open(
"upi://pay?pa=ribmgsm@okaxis&pn=UCoin&cu=INR"
);

}

</script>

</body>

</html>
