<body>
    <div class="glow"></div>

    <nav>
        <a href="index.html" class="nav-logo">UCoin</a>
        <div class="nav-links">
            <a href="about.html">About</a>
            <a href="token.html">Token</a>
            <a href="roadmap.html">Roadmap</a>
        </div>
    </nav>

    <main class="hero">
        <img src="https://uc-pearl.vercel.app/UCoin.png" alt="UCoin Logo" class="logo-img">
        <p class="supply-tag">1,000,000 Max Supply</p>
        <h1>UCoin</h1>

        <div class="ca-container">
            <code id="caValue">Gt92GsKA2TBudXo7uvfZsqMYu9tWHoMw21i4wRE2xszt</code>
            <button class="btn btn-outline" style="font-size: 12px; padding: 12px 25px; width: auto; border-radius: 12px;" onclick="copyCA()" id="copyBtn">
                📋 COPY CONTRACT
            </button>
        </div>

        <div class="btn-row">
            <a href="https://jup.ag/swap?sell=So11111111111111111111111111111111111111112&buy=Gt92GsKA2TBudXo7uvfZsqMYu9tWHoMw21i4wRE2xszt" class="btn btn-gold" target="_blank">
                💰 BUY $UC NOW
            </a>
            <a href="https://photon-sol.tinyastro.io/en/lp/6HPenRbShv4CjSmqqACAakDypYxbCtaf8UckZZ9dghtr" class="btn btn-outline" target="_blank">
                📊 LIVE CHART
            </a>
        </div>
    </main>

    <footer>
        <div class="f-socials">
            <a href="https://t.me/ucoin_live" target="_blank">📱 TELEGRAM</a>
            <a href="https://x.com/UCoin_live" target="_blank">𝕏 TWITTER</a>
            <a href="https://www.instagram.com/ucoin_live" target="_blank">📸 INSTAGRAM</a>
        </div>
        <div class="copy-text">
            EST. 2026 • BUILT ON SOLANA 🚀
        </div>
    </footer>

    <script>
        function copyCA() {
            const text = document.getElementById("caValue").innerText.trim();
            const btn = document.getElementById("copyBtn");

            navigator.clipboard.writeText(text).then(() => {
                btn.innerText = "✔ COPIED";
                btn.style.color = "#00ff9d";
                btn.style.borderColor = "#00ff9d";

                // Show toast notification
                showToast("Contract Address Copied!");

                setTimeout(() => {
                    btn.innerText = "📋 COPY CONTRACT";
                    btn.style.color = "#fff";
                    btn.style.borderColor = "rgba(255,255,255,0.1)";
                }, 2000);
            }).catch(err => {
                alert("Failed to copy!");
            });
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
    </script>
</body>
</html>
